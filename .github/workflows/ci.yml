name: CI Pipeline

on:
  push:
    branches: [main, master]
    paths: [lab5/**]
  pull_request:
    branches: [main, master]
    paths: [lab5/**]

defaults:
  run:
    working-directory: lab5

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run flake8
        run: python -m flake8 src/ app.py --max-line-length=120

      - name: Run pylint
        run: python -m pylint src/ app.py --fail-under=8

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest tests/ -v --tb=short

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build application image
        run: docker build -t game-store-app .

      - name: Build test image
        run: docker build -t game-store-tests -f Dockerfile.test .

      - name: Run tests in container
        run: docker run --rm game-store-tests
