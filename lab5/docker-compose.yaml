services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_DEBUG=0
      - DATABASE_URL=postgresql://store_user:store_pass@db:5432/game_store
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=store_user
      - POSTGRES_PASSWORD=store_pass
      - POSTGRES_DB=game_store
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store_user -d game_store"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      - DATABASE_URL=postgresql://store_user:store_pass@db:5432/game_store
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
